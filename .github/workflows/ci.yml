name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false # builds use the checked-in vendor tree
      - name: Module graph matches source
        run: go mod tidy -diff
      - name: Formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal e2e tools/smokecheck)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./... -count=1
      - name: Race detector
        if: runner.os != 'Windows'
        run: go test -race ./... -count=1
      - name: Shell syntax and smoke-check self-tests (no model calls)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n install.sh tools/claude_smoke.sh
          sh tools/claude_smoke.sh --self-test
      - name: No network packages linked
        run: go test ./cmd/standin -run 'TestNoNetworkPackages|TestOnlyInitRunsPrograms' -count=1
      - name: Static binary
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o standin-ci${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/standin

  archives:
    name: Check and build all release archives (no publication)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Module graph matches source
        run: go mod tidy -diff
      - uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: v2.11.2
          args: check
      - uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: v2.11.2
          args: release --snapshot --clean
